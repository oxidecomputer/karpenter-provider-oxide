# -- Overrides the chart's name.
nameOverride: ""
# -- Overrides the chart's computed fullname.
fullnameOverride: ""
# -- Additional labels to add into metadata.
additionalLabels: {}
# -- Additional annotations to add into metadata.
additionalAnnotations: {}
# -- Image pull policy for Docker images.
imagePullPolicy: IfNotPresent
# -- Image pull secrets for Docker images.
imagePullSecrets: []
serviceAccount:
  # -- Specifies if a ServiceAccount should be created.
  create: true
  # -- The name of the ServiceAccount to use.
  name: ""
  # -- Additional annotations for the ServiceAccount.
  annotations: {}
# -- Specifies additional rules for the core ClusterRole.
additionalClusterRoleRules: []
# -- Bootstrap provider configuration.
# Which bootstrap providers this install may operate. The provider itself is detected from
# the cluster unless an OxideNodeClass names one; these only gate its RBAC.
bootstrap:
  rke2:
    # -- Enable RBAC for the RKE2 bootstrap provider.
    enabled: true
    # -- The Secret holding the RKE2 agent join token.
    tokenSecret:
      # -- Namespace of the token Secret.
      namespace: ""
      # -- Name of the token Secret.
      name: rancher-agent-token
  kubeadm:
    # -- Enable RBAC for the kubeadm bootstrap provider.
    enabled: false
serviceMonitor:
  # -- Specifies whether a ServiceMonitor should be created.
  enabled: false
  # -- Additional labels for the ServiceMonitor.
  additionalLabels: {}
  # -- Endpoint configuration for the ServiceMonitor.
  endpointConfig: {}
# -- Number of replicas.
replicas: 1
# -- The number of old ReplicaSets to retain to allow rollback.
revisionHistoryLimit: 10
# -- Strategy for updating the pod.
strategy:
  rollingUpdate:
    maxUnavailable: 1
# -- Additional labels for the pod.
podLabels: {}
# -- Additional annotations for the pod.
podAnnotations: {}
podDisruptionBudget:
  name: karpenter
  maxUnavailable: 1
# -- SecurityContext for the pod.
podSecurityContext:
  fsGroup: 65536
# -- PriorityClass name for the pod.
priorityClassName: system-cluster-critical
# -- Override the default termination grace period for the pod.
terminationGracePeriodSeconds:
# -- Bind the pod to the host network.
hostNetwork: false
# -- Configure the DNS Policy for the pod.
dnsPolicy: Default
# -- Configure DNS Config for the pod.
dnsConfig: {}
# -- Node selectors to schedule the pod to nodes with labels.
nodeSelector:
  kubernetes.io/os: linux
# -- Affinity rules for scheduling the pod.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: "kubernetes.io/hostname"
# -- Topology spread constraints to increase the controller resilience by distributing pods across the cluster zones.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
# -- Tolerations to allow the pod to be scheduled to nodes with taints.
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
# -- Additional volumes for the pod.
extraVolumes: []
controller:
  image:
    # -- Repository path to the controller image.
    repository: ghcr.io/oxidecomputer/karpenter-provider-oxide
    # -- Tag of the controller image.
    tag: ""
    # -- SHA256 digest of the controller image.
    digest: ""
  # -- Additional environment variables for the controller pod.
  env: []
  envFrom: []
  # -- Resources for the controller pod.
  resources: {}
  # -- Additional volumeMounts for the controller pod.
  extraVolumeMounts: []
  metrics:
    # -- The container port to use for metrics.
    port: 8080
  healthProbe:
    # -- The container port to use for http health probe.
    port: 8081
# -- Global log level, defaults to 'info'.
logLevel: info
# -- Global settings to configure Karpenter.
settings:
  # -- Oxide API configuration.
  oxide:
    # -- URL of the Oxide API, for example https://oxide.sys.example.com.
    host: ""
    # -- Oxide project that Karpenter provisions instances into.
    project: ""
    # -- Secret in the release namespace holding the Oxide API token.
    tokenSecret:
      name: oxide-api-token
      key: token
    # -- Identity this cluster records on every Oxide resource it creates.
    clusterID: ""
  # -- Launch deadlines.
  launch:
    # -- Overall bound on a single launch, across every Oxide API call it makes.
    deadline: 3m
    # -- Independent post-failure cleanup budget after the launch context ends.
    cleanupDeadline: 1m30s
    # -- How long a disk may sit in the creating state.
    diskCreatingDeadline: 1m
    # -- How long deleting one disk may be retried.
    diskDeletingDeadline: 1m30s
    # -- How long an instance may sit in the creating state.
    instanceCreatingDeadline: 1m
    # -- Node registration deadline for a placed instance.
    instanceStartingDeadline: 5m
    # -- How long a teardown waits for an instance to reach a state the Oxide API accepts a delete in.
    instanceStoppingDeadline: 1m
  # -- Instance type catalog generation.
  instanceTypes:
    # -- Percentage increase between successive CPU and memory values in the generated catalog.
    incrementPercent: 10
  # -- Sled inventory configuration.
  inventory:
    # -- Enable the sled inventory controllers.
    enabled: false
  # -- The maximum length of a batch window.
  batchMaxDuration: 10s
  # -- The maximum amount of time with no new pending pods that if exceeded ends the current batching window.
  batchIdleDuration: 1s
  # -- How the Karpenter scheduler should treat preferences.
  preferencePolicy: Respect
  # -- How the Karpenter scheduler treats min values.
  minValuesPolicy: Strict
  # -- Feature gate configuration values.
  featureGates:
    # -- spotToSpotConsolidation is ALPHA and is disabled by default.
    spotToSpotConsolidation: false
    # -- nodeRepair is ALPHA and is disabled by default.
    nodeRepair: false
    # -- staticCapacity is ALPHA and is disabled by default.
    staticCapacity: false
    # -- nodeOverlay is ALPHA and is disabled by default.
    nodeOverlay: false
