---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: oxidecapacities.karpenter.oxide.computer
spec:
  group: karpenter.oxide.computer
  names:
    categories:
    - karpenter
    kind: OxideCapacity
    listKind: OxideCapacityList
    plural: oxidecapacities
    shortNames:
    - oxcap
    - oxcaps
    singular: oxidecapacity
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Instance types the scheduler is not currently offered
      jsonPath: .status.instanceTypes.unavailableCount
      name: Unavailable
      type: integer
    - description: Instance types the provider offers in total
      jsonPath: .status.instanceTypes.count
      name: Total
      priority: 1
      type: integer
    - description: Regions of the catalog that are out, each covering many instance
        types
      jsonPath: .status.instanceTypes.unavailableRangeCount
      name: Ranges
      priority: 1
      type: integer
    - description: Largest shape the rack can currently place
      jsonPath: .status.inventory.largestFeasibleInstanceType
      name: Largest
      type: string
    - jsonPath: .status.inventory.state
      name: Inventory
      type: string
    - description: Why the last boot disk could not be provisioned, if one could not
      jsonPath: .status.storage.reason
      name: Storage
      type: string
    - jsonPath: .status.observedAt
      name: Updated
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      priority: 1
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OxideCapacity reports which instance shapes the provider will
          not currently launch, and why.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: OxideCapacityStatus is what the provider currently believes
              about capacity.
            properties:
              instanceTypes:
                description: InstanceTypes is what the scheduler is and is not being
                  offered, and why.
                properties:
                  count:
                    description: Count is how many instance types the provider offers
                      in total, which is the denominator for UnavailableCount.
                    type: integer
                  unavailableCount:
                    description: UnavailableCount is how many instance types the scheduler
                      is currently not being offered, out of Count.
                    type: integer
                  unavailableRangeCount:
                    description: UnavailableRangeCount is how many entries UnavailableRanges
                      holds.
                    type: integer
                  unavailableRanges:
                    description: UnavailableRanges is every region of the catalog
                      the provider is not currently offering.
                    items:
                      description: UnavailableRange is a region of the instance type
                        catalog the provider will not currently launch from.
                      properties:
                        consecutiveRefusals:
                          description: ConsecutiveRefusals is how many times in a
                            row a launch in this range has been refused.
                          type: integer
                        fromMemoryGiB:
                          type: integer
                        fromNcpus:
                          description: FromNcpus and FromMemoryGiB are the lower corner
                            of a refusal range.
                          type: integer
                        largestLaunchable:
                          description: LargestLaunchable is the largest shape known
                            to work within this range.
                          type: string
                        lastRefusal:
                          description: LastRefusal is when a launch in this range
                            was most recently refused.
                          format: date-time
                          type: string
                        maxMemoryGiB:
                          type: integer
                        maxNcpus:
                          description: MaxNcpus and MaxMemoryGiB are the headroom
                            of an inventory range.
                          type: integer
                        range:
                          description: 'Range is what is out, in the form an operator
                            reads: ">=11 vCPUs and >=22 GiB" for a refusal.'
                          type: string
                        reason:
                          description: 'Reason is what put the range out: InsufficientCapacity
                            for a launch the rack refused for want of room.'
                          type: string
                        refusedInstanceType:
                          description: RefusedInstanceType is the shape whose launch
                            was actually refused, which is the evidence the range
                            rests on.
                          type: string
                        retryAfter:
                          description: RetryAfter is when the shape will be offered
                            again for a trial launch.
                          format: date-time
                          type: string
                        state:
                          description: State is Backoff while the range is out of
                            consideration entirely.
                          type: string
                      required:
                      - range
                      - reason
                      type: object
                    type: array
                type: object
              inventory:
                description: Inventory is what the rack was last read to have room
                  for, and how much that reading is worth.
                properties:
                  largestFeasibleInstanceType:
                    description: LargestFeasibleInstanceType is the largest shape
                      any single sled could take, as an instance type name.
                    type: string
                  observedAt:
                    description: ObservedAt is when the reading was taken, which is
                      not when this view was published.
                    format: date-time
                    type: string
                  sleds:
                    description: Sleds is the per-sled headroom the reading is made
                      of.
                    items:
                      description: SledCapacity is one sled's remaining headroom.
                      properties:
                        freeCPUs:
                          description: FreeCPUs and FreeMemoryGiB are what is left
                            on the sled for instances.
                          type: integer
                        freeMemoryGiB:
                          type: integer
                        id:
                          description: ID is the Oxide sled ID.
                          type: string
                        largestFeasibleInstanceType:
                          description: LargestFeasibleInstanceType is the largest
                            shape this sled could take.
                          type: string
                        provisionable:
                          description: Provisionable is whether the sled will accept
                            a new instance at all.
                          type: boolean
                      required:
                      - freeCPUs
                      - freeMemoryGiB
                      - id
                      - provisionable
                      type: object
                    type: array
                  state:
                    description: 'State is what the reading is contributing: Disabled,
                      Unknown, Stale or Fresh.'
                    type: string
                type: object
              observedAt:
                description: ObservedAt is when this view was last published.
                format: date-time
                type: string
              quota:
                description: Quota is the silo's remaining entitlement.
                properties:
                  cpus:
                    description: CPUs, MemoryGiB and StorageGiB are the quota's capacity
                      less what the silo has provisioned.
                    format: int64
                    type: integer
                  memoryGiB:
                    format: int64
                    type: integer
                  storageGiB:
                    format: int64
                    type: integer
                required:
                - cpus
                - memoryGiB
                - storageGiB
                type: object
              storage:
                description: Storage is the last launch refused because its boot disk
                  could not be provisioned.
                properties:
                  consecutiveRefusals:
                    description: ConsecutiveRefusals is how many launches in a row
                      have been refused this way.
                    type: integer
                  lastRefusal:
                    description: LastRefusal is when the most recent one happened.
                    format: date-time
                    type: string
                  message:
                    description: Message is the diagnosis as it was reported on the
                      NodeClaim that was refused.
                    type: string
                  reason:
                    description: 'Reason is which limit was diagnosed as binding:
                      QuotaExceeded for the silo''s storage entitlement.'
                    type: string
                required:
                - consecutiveRefusals
                - reason
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
