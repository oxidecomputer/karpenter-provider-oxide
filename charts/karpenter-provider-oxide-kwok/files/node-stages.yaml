apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: oxide-backend-running
spec:
  resourceRef:
    apiGroup: v1
    kind: Node
  selector:
    matchLabels:
      kwok.x-k8s.io/node: fake
      kwok.oxide.computer/managed: "true"
      kwok.oxide.computer/backend-state: running
    matchExpressions:
      - key: '.metadata.deletionTimestamp'
        operator: DoesNotExist
  delay:
    durationMilliseconds: 5000
  next:
    patches:
      - subresource: status
        type: strategic
        template: |
          status:
            conditions:
            - type: Ready
              status: "True"
              reason: OxideBackendrunning
              message: "Simulated kubelet; backend running"
              lastHeartbeatTime: {{ Now | Quote }}
              {{ $transition := Now }}
              {{ range .status.conditions }}
              {{ if and (eq .type "Ready") (eq .status "True") }}
              {{ $transition = .lastTransitionTime }}
              {{ end }}
              {{ end }}
              lastTransitionTime: {{ $transition | Quote }}
---
