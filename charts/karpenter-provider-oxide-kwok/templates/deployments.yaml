{{- $root := . -}}
{{- range $component := list "bridge" "simulator" }}
{{- $bridge := eq $component "bridge" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxide-kwok.name" $root }}-{{ $component }}
  labels:
    {{- include "oxide-kwok.labels" $root | nindent 4 }}
spec:
  replicas: {{ if $bridge }}{{ $root.Values.bridge.replicas }}{{ else }}1{{ end }}
  {{- if not $bridge }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "oxide-kwok.name" $root }}-{{ $component }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        {{- toYaml $root.Values.nodeSelector | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kwok.x-k8s.io/node, operator: DoesNotExist}
                  - {key: karpenter.sh/nodepool, operator: DoesNotExist}
      tolerations:
        {{- toYaml $root.Values.tolerations | nindent 8 }}
      containers:
        - name: {{ $component }}
          {{- if $bridge }}
          {{- $image := $root.Values.bridge.image }}
          image: {{ if $image.digest }}{{ printf "%s@%s" $image.repository $image.digest | quote }}{{ else }}{{ printf "%s:%s" $image.repository ($image.tag | default $root.Chart.AppVersion) | quote }}{{ end }}
          imagePullPolicy: {{ $image.pullPolicy }}
          args:
            - --leader-elect=true
            - --poll-interval={{ $root.Values.bridge.pollInterval }}
            - --stale-after={{ $root.Values.bridge.staleAfter }}
            - --api-timeout={{ $root.Values.bridge.apiTimeout }}
            - --concurrency={{ $root.Values.bridge.concurrency }}
            - --remove-startup-taints={{ join "," $root.Values.bridge.removeStartupTaints }}
          env:
            - name: OXIDE_HOST
              value: {{ required "provider.settings.oxide.host is required" $root.Values.provider.settings.oxide.host | quote }}
            - name: OXIDE_PROJECT
              value: {{ required "provider.settings.oxide.project is required" $root.Values.provider.settings.oxide.project | quote }}
            - name: OXIDE_CLUSTER_ID
              value: {{ $root.Values.provider.settings.oxide.clusterID | quote }}
            - name: OXIDE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.provider.settings.oxide.tokenSecret.name | quote }}
                  key: {{ $root.Values.provider.settings.oxide.tokenSecret.key | quote }}
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          ports:
            - {name: health, containerPort: 8081}
            - {name: metrics, containerPort: 8080}
          resources:
            {{- toYaml $root.Values.bridge.resources | nindent 12 }}
          {{- else }}
          image: {{ $root.Values.kwok.image | quote }}
          imagePullPolicy: {{ $root.Values.kwok.imagePullPolicy }}
          args: ["--config=/etc/kwok/kwok.yaml"]
          ports:
            - {name: health, containerPort: 10247}
          resources:
            {{- toYaml $root.Values.kwok.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/kwok, readOnly: true}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 30
            periodSeconds: 10
      {{- if not $bridge }}
      volumes:
        - name: config
          configMap:
            name: {{ include "oxide-kwok.name" $root }}
      {{- end }}
{{- end }}
