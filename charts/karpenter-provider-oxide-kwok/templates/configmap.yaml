apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oxide-kwok.name" . }}
  labels:
    {{- include "oxide-kwok.labels" . | nindent 4 }}
data:
  # Loaded as a multi-document KWOK config; no Stage CRDs or default Ready stages.
  kwok.yaml: |
    apiVersion: config.kwok.x-k8s.io/v1alpha1
    kind: KwokConfiguration
    options:
      manageAllNodes: false
      manageNodesWithAnnotationSelector: ""
      manageNodesWithLabelSelector: "kwok.x-k8s.io/node=fake,kwok.oxide.computer/managed=true"
      enableCRDs: []
      nodePort: 10247
      cidr: 10.0.0.0/24
      nodeLeaseDurationSeconds: 40
      nodeLeaseParallelism: 2
      nodePlayStageParallelism: 2
      podPlayStageParallelism: 2
      podsOnNodeSyncParallelism: 2
      enableProfilingHandler: false
    ---
    {{- .Files.Get "files/node-stages.yaml" | nindent 4 }}
    {{- range $path, $_ := .Files.Glob "files/pod-*.yaml" }}
    ---
    {{- $root := $ }}
    {{- $root.Files.Get $path | nindent 4 }}
    {{- end }}
