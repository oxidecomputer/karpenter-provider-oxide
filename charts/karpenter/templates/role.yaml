{{/*
Namespaced permissions.

Every rule here is scoped as tightly as RBAC allows: to a single namespace, and where the verb
supports it, to specific object names. The bootstrap-provider roles are rendered only for the
providers that are actually enabled, so a cluster that only uses RKE2 never grants the controller
the ability to write to kube-system, and vice versa.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karpenter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["patch", "update"]
    resourceNames:
      - "karpenter-leader-election"
  # resourceNames cannot be used with create, since the object does not exist yet.
  # https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-resources
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karpenter.fullname" . }}-dns
  namespace: kube-system
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # Karpenter reads the cluster DNS service to compute pod resource overhead.
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kube-dns"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karpenter.fullname" . }}-lease
  namespace: kube-node-lease
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # Node leases are deleted alongside the nodes Karpenter terminates.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karpenter.fullname" . }}-apiserver-discovery
  namespace: default
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # The nodeclass controller discovers the kube-apiserver address from the EndpointSlice backing the
  # default/kubernetes service. It is read by name through the uncached reader, so list and watch are
  # not required.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    resourceNames: ["kubernetes"]
    verbs: ["get"]
{{- if .Values.bootstrap.kubeadm.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karpenter.fullname" . }}-kubeadm-discovery
  namespace: kube-public
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # cluster-info carries the cluster CA and apiserver endpoint used for kubeadm token discovery. It
  # is readable by unauthenticated users by design, so this grant is not sensitive, but it is still
  # pinned to the single ConfigMap that is actually read.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-info"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karpenter.fullname" . }}-kubeadm-token
  namespace: kube-system
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # Bootstrap tokens must live in kube-system, since that is where the kube-apiserver's token
  # authenticator looks for them.
  #
  # create is the only verb granted. It cannot be narrowed by resourceNames, but withholding get,
  # list and watch means this role confers no ability to read any existing kube-system Secret, which
  # is the permission that would actually matter if the controller were compromised. Tokens are
  # never read back, and the control plane's tokencleaner controller removes them once they expire,
  # so no delete is needed either.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
{{- end }}
{{- if .Values.bootstrap.rke2.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karpenter.fullname" . }}-rke2-token
  namespace: {{ default .Release.Namespace .Values.bootstrap.rke2.tokenSecret.namespace }}
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  # Read access to exactly one Secret: the RKE2 agent join token named in the OxideNodeClass. This
  # must be kept in sync with spec.bootstrap.rke2.tokenRef. It is read by name through the uncached
  # reader, so list and watch are not required.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ required "bootstrap.rke2.tokenSecret.name is required when the rke2 bootstrap provider is enabled" .Values.bootstrap.rke2.tokenSecret.name | quote }}]
    verbs: ["get"]
{{- end }}
