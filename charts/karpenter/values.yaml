# -- Overrides the chart's name.
nameOverride: ""
# -- Overrides the chart's computed fullname.
fullnameOverride: ""
# -- Additional labels to add into metadata.
additionalLabels: {}
# -- Additional annotations to add into metadata.
additionalAnnotations: {}
# -- Image pull policy for Docker images.
imagePullPolicy: IfNotPresent
# -- Image pull secrets for Docker images.
imagePullSecrets: []
serviceAccount:
  # -- Specifies if a ServiceAccount should be created.
  create: true
  # -- The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""
  # -- Additional annotations for the ServiceAccount.
  annotations: {}
# -- Specifies additional rules for the core ClusterRole.
additionalClusterRoleRules: []
# -- Bootstrap provider configuration. Only enable the providers actually in use: each one is granted
# its own namespaced Role, so a disabled provider's permissions are never created at all.
bootstrap:
  rke2:
    # -- Enable RBAC for the RKE2 bootstrap provider.
    enabled: true
    # -- The Secret holding the RKE2 agent join token. The controller is granted get on this one
    # Secret by name, so this must match spec.bootstrap.rke2.tokenRef on the OxideNodeClass.
    tokenSecret:
      # -- Namespace of the token Secret. Defaults to the release namespace.
      namespace: ""
      # -- Name of the token Secret.
      name: rancher-agent-token
  kubeadm:
    # -- Enable RBAC for the kubeadm bootstrap provider. This grants get on the
    # kube-public/cluster-info ConfigMap and create (but not read) on kube-system Secrets, so that
    # short-lived bootstrap tokens can be minted per node.
    enabled: false
serviceMonitor:
  # -- Specifies whether a ServiceMonitor should be created.
  enabled: false
  # -- Additional labels for the ServiceMonitor.
  additionalLabels: {}
  # -- Endpoint configuration for the ServiceMonitor.
  endpointConfig: {}
# -- Number of replicas.
replicas: 1
# -- The number of old ReplicaSets to retain to allow rollback.
revisionHistoryLimit: 10
# -- Strategy for updating the pod.
strategy:
  rollingUpdate:
    maxUnavailable: 1
# -- Additional labels for the pod.
podLabels: {}
# -- Additional annotations for the pod.
podAnnotations: {}
podDisruptionBudget:
  name: karpenter
  maxUnavailable: 1
# -- SecurityContext for the pod.
podSecurityContext:
  fsGroup: 65536
# -- PriorityClass name for the pod.
priorityClassName: system-cluster-critical
# -- Override the default termination grace period for the pod.
terminationGracePeriodSeconds:
# -- Bind the pod to the host network. This is required when using a custom CNI.
hostNetwork: false
# -- Configure the DNS Policy for the pod.
dnsPolicy: Default
# -- Configure DNS Config for the pod.
dnsConfig: {}
# -- Node selectors to schedule the pod to nodes with labels.
nodeSelector:
  kubernetes.io/os: linux
# -- Affinity rules for scheduling the pod. If an explicit label selector is not provided for pod
# affinity or pod anti-affinity one will be created from the pod selector labels.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: "kubernetes.io/hostname"
# -- Topology spread constraints to increase the controller resilience by distributing pods across
# the cluster zones. If an explicit label selector is not provided one will be created from the pod
# selector labels.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
# -- Tolerations to allow the pod to be scheduled to nodes with taints.
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
# -- Additional volumes for the pod.
extraVolumes: []
controller:
  image:
    # -- Repository path to the controller image.
    repository: ghcr.io/oxidecomputer/karpenter
    # -- Tag of the controller image. Defaults to the chart's appVersion.
    tag: ""
    # -- SHA256 digest of the controller image.
    digest: ""
  # -- Additional environment variables for the controller pod.
  env: []
  envFrom: []
  # -- Resources for the controller pod.
  resources: {}
  # -- Additional volumeMounts for the controller pod.
  extraVolumeMounts: []
  metrics:
    # -- The container port to use for metrics.
    port: 8080
  healthProbe:
    # -- The container port to use for http health probe.
    port: 8081
# -- Global log level, defaults to 'info'.
logLevel: info
# -- Global settings to configure Karpenter.
settings:
  # -- Oxide API configuration.
  oxide:
    # -- URL of the Oxide API, for example https://oxide.sys.example.com.
    host: ""
    # -- Oxide project that Karpenter provisions instances into.
    project: ""
    # -- Secret in the release namespace holding the Oxide API token. The token is referenced rather
    # than templated so it is never written into the Helm release.
    tokenSecret:
      name: oxide-api-token
      key: token
  # -- Silo quota configuration. Constrains the instance types Karpenter offers to those the silo has
  # quota headroom for, so the scheduler does not pick a shape the API will refuse.
  quota:
    # -- Enable silo quota awareness. This reads /v1/utilization, which is silo-scoped and needs no
    # permissions beyond launching instances, so it is on by default. If the read fails, instance
    # types are left unconstrained and a launch that exceeds the quota fails at the API instead;
    # provisioning is never blocked by an unreadable quota.
    enabled: true
    # -- How often the silo's quota is re-read. This is a single API call, and what it measures changes
    # whenever anything in the silo starts or stops.
    refreshPeriod: 1m
  # -- Sled inventory configuration. Records which physical sled each node landed on, as labels and
  # annotations on the Node and NodeClaim, and uses the same rack reading to stop offering instance
  # types no sled has room for. Provisioning still works whether this is enabled, disabled, or
  # failing: a snapshot that stops refreshing is ignored, and unplaceable shapes are then learned
  # from refused launches instead.
  inventory:
    # -- Enable the sled inventory controllers. This requires an Oxide token with fleet-level read
    # access to the system API (/v1/system/hardware/sleds), which is a much broader grant than
    # provisioning instances into a single project. Leave this disabled unless the placement labels
    # are wanted. If enabled with a token that cannot read the system API, the controller logs the
    # failure and applies no labels rather than failing.
    enabled: false
    # -- How often the sled inventory is re-read from the Oxide API. Building it costs one API call
    # per sled in the rack, so lowering this raises fleet API load proportionally. A reading is
    # trusted for twice this long; past that it is ignored rather than allowed to constrain
    # provisioning on stale information.
    refreshPeriod: 5m
    # -- How long a node may sit on a sled that is being taken out of service (expunged, or closed to
    # new placements) before Karpenter drains it and provisions a replacement. Replacement ALSO
    # requires settings.featureGates.nodeRepair, and is subject to core's node repair guardrail that
    # blocks repair while more than 20% of a NodePool's nodes are unhealthy. Set to 0 to record sled
    # health without ever replacing nodes for it.
    repairTolerationDuration: 30m
  # -- The maximum length of a batch window. The longer this is, the more pods we can consider for
  # provisioning at one time which usually results in fewer but larger nodes.
  batchMaxDuration: 10s
  # -- The maximum amount of time with no new pending pods that if exceeded ends the current batching
  # window.
  batchIdleDuration: 1s
  # -- How the Karpenter scheduler should treat preferences. Can be one of 'Ignore' and 'Respect'.
  preferencePolicy: Respect
  # -- How the Karpenter scheduler treats min values. Options are 'Strict' and 'BestEffort'.
  minValuesPolicy: Strict
  # -- Feature gate configuration values.
  featureGates:
    # -- spotToSpotConsolidation is ALPHA and is disabled by default.
    spotToSpotConsolidation: false
    # -- nodeRepair is ALPHA and is disabled by default.
    nodeRepair: false
    # -- staticCapacity is ALPHA and is disabled by default.
    staticCapacity: false
    # -- nodeOverlay is ALPHA and is disabled by default.
    nodeOverlay: false
