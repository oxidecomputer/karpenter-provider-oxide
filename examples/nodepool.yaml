 apiVersion: karpenter.sh/v1
 kind: NodePool
 metadata:
   name: default
 spec:
   disruption:
     budgets:
     - nodes: 50%
     consolidateAfter: 1m
     consolidationPolicy: WhenEmptyOrUnderutilized
   limits:
     cpu: 1000
   template:
     spec:
       expireAfter: 720h
       nodeClassRef:
         group: karpenter.oxide.computer
         kind: OxideNodeClass
         name: default
       requirements:
       - key: kubernetes.io/arch
         operator: In
         values:
         - amd64
       - key: kubernetes.io/os
         operator: In
         values:
         - linux
       startupTaints:
       - key: node.cilium.io/agent-not-ready
         effect: NoSchedule