apiVersion: karpenter.oxide.computer/v1alpha1
kind: OxideNodeClass
metadata:
  name: default
spec:
  storage:
    boot:
      size: 20Gi
    # Additional disks attached to every node. An instance can attach 8 disks in total, and the boot
    # disk is one of them, so the counts below may sum to at most 7.
    # diskSets:
    #   # A second distributed disk, so container images and etcd data are not on the boot disk.
    #   # mountPath is a single mount point, which is why this set is one disk.
    #   - name: kubernetes
    #     type: Distributed
    #     size: 100Gi
    #     filesystem: ext4          # ext4 (the default when unset), xfs, or None for a raw block device
    #     mountPath: /var/lib/rancher
    #
    #   # Sled-local disks for the local static provisioner. mountDir is a parent directory: these
    #   # land at /mnt/local-pv/local-pv-0 through -3, which is what its hostDir expects.
    #   #
    #   # A local disk lives on the sled the instance is placed on. It does not outlive the instance,
    #   # cannot be created from an image or a snapshot, and can come back blank, in which case it is
    #   # reformatted on the next boot -- so anything on it can vanish.
    #   - name: local-pv
    #     type: Local
    #     count: 4
    #     size: 500Gi
    #     layout: Individual        # Individual is the only layout today
    #     filesystem: ext4
    #     mountDir: /mnt/local-pv
    #
    #   # Raw block devices, for a consumer that manages its own on-disk format. Nothing is created on
    #   # them and nothing is mounted; each is symlinked into mountDir, which is the local static
    #   # provisioner's volumeMode: Block discovery mode.
    #   - name: raw
    #     type: Local
    #     count: 2
    #     size: 500Gi
    #     filesystem: None
    #     mountDir: /mnt/raw
    #
    #   # A Distributed set can be created from an image or a snapshot instead of blank. It arrives
    #   # already carrying a filesystem, so filesystem must not be set: it would be formatted over.
    #   # Note the copy is still deleted with the node.
    #   - name: restored
    #     type: Distributed
    #     size: 200Gi
    #     mountPath: /var/lib/dataset
    #     snapshotSelector:
    #       - name: nightly-*
    #     readOnly: false
  kubeletArgs:
    - cloud-provider=external
  bootstrap:
    # No join credential is configured here. Discovery information is read from the
    # kube-public/cluster-info ConfigMap, and a bootstrap token is minted per node with the TTL
    # below, so a token only exists while a node is actually joining.
    kubeadm:
      tokenTTL: 15m
      # Use kubeadm.k8s.io/v1beta3 on clusters older than Kubernetes 1.31.
      configVersion: kubeadm.k8s.io/v1beta4
  imageSelector:
    - id: 444f4178-6bee-45f7-a654-c6ecafd4bb9e
  subnetSelector:
    - project: brandon
      vpcName: oxke
