apiVersion: karpenter.oxide.computer/v1alpha1
kind: OxideNodeClass
metadata:
  name: default
spec:
  storage:
    boot:
      size: 20Gi
  kubeletArgs:
    - cloud-provider=external
  bootstrap:
    rke2:
      tokenRef:
        key: token
        name: rancher-agent-token
        namespace: karpenter
  imageSelector:
    - name: rke2-ubuntu-1780929039
      os: ubuntu
      project: brandon
  subnetSelector:
    - project: brandon
      vpcName: default
