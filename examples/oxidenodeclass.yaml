apiVersion: karpenter.oxide.computer/v1alpha1
kind: OxideNodeClass
metadata:
  name: default
spec:
  bootDiskSize: 20Gi
  # Shared by every bootstrap provider. Leave server unset to discover the kube-apiserver from the
  # default/kubernetes EndpointSlice; each provider renders it with the port it joins on.
  kubeletArgs:
    - cloud-provider=external
  bootstrap:
    rke2:
      tokenRef:
        key: token
        name: rancher-agent-token
        namespace: karpenter
  imageSelector:
    - name: rke2-ubuntu-1780929039
      os: ubuntu
      project: brandon
    # Versions are matched literally unless they contain a "*", which matches whole segments: this
    # takes the newest 1.2.x image, but never 1.2 or 1.20. Selectors are OR'd, so this only applies
    # if the image named above is gone.
    # - os: ubuntu
    #   version: 1.2.*
    #   project: brandon
  subnetSelector:
    - project: brandon
      vpcName: default
