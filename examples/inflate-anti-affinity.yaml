apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate-anti-affinity
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inflate-anti-affinity
  template:
    metadata:
      labels:
        app: inflate-anti-affinity
    spec:
      terminationGracePeriodSeconds: 0
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: inflate-anti-affinity
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
        - name: inflate-anti-affinity
          image: ghcr.io/containerd/ghcr.io/containerd/pause@sha256:1d54a4311989cea19b8c22d87c2e8d63311c9677d4776a1c7197782c1f9a7717
          resources:
            requests:
              cpu: 1
          securityContext:
            allowPrivilegeEscalation: false
