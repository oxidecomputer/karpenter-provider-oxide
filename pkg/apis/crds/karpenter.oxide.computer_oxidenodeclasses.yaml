---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: oxidenodeclasses.karpenter.oxide.computer
spec:
  group: karpenter.oxide.computer
  names:
    categories:
    - karpenter
    kind: OxideNodeClass
    listKind: OxideNodeClassList
    plural: oxidenodeclasses
    shortNames:
    - oxidenc
    - oxidencs
    - oxnc
    - oxncs
    - oxnodeclass
    - oxnodeclasses
    singular: oxidenodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.role
      name: Role
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OxideNodeClass is an Oxide Karpenter node class.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OxideNodeClassSpec is the top level specification for the
              Oxide Karpenter Provider.
            properties:
              affinity:
                description: Affinity controls which Oxide affinity and anti-affinity
                  groups launched instances join.
                properties:
                  affinityGroupSelector:
                    description: AffinityGroupSelector selects existing affinity groups
                      that every launched instance joins.
                    items:
                      description: AffinityGroupSelector selects affinity or anti-affinity
                        groups by ID or by name.
                      properties:
                        id:
                          description: ID is the exact group UUID.
                          type: string
                        name:
                          description: Name is the name of a group.
                          type: string
                      type: object
                    type: array
                  antiAffinityGroupSelector:
                    description: AntiAffinityGroupSelector selects existing anti-affinity
                      groups that every launched instance joins.
                    items:
                      description: AffinityGroupSelector selects affinity or anti-affinity
                        groups by ID or by name.
                      properties:
                        id:
                          description: ID is the exact group UUID.
                          type: string
                        name:
                          description: Name is the name of a group.
                          type: string
                      type: object
                    type: array
                  managed:
                    description: Managed asks Karpenter to own one group for this
                      nodeclass that every launched instance joins.
                    properties:
                      policy:
                        default: allow
                        description: Policy is what the rack does when the request
                          cannot be satisfied.
                        enum:
                        - allow
                        - fail
                        type: string
                      type:
                        description: Type selects affinity or anti-affinity placement.
                        enum:
                        - Affinity
                        - AntiAffinity
                        type: string
                    required:
                    - type
                    type: object
                type: object
              bootstrap:
                description: Bootstrap selects and configures the mechanism nodes
                  use to join the cluster.
                properties:
                  kubeadm:
                    description: KubeadmBootstrap configures joining nodes with kubeadm.
                    properties:
                      configVersion:
                        default: kubeadm.k8s.io/v1beta4
                        description: ConfigVersion is the kubeadm configuration API
                          version used to render the JoinConfiguration.
                        enum:
                        - kubeadm.k8s.io/v1beta3
                        - kubeadm.k8s.io/v1beta4
                        type: string
                      tokenTTL:
                        default: 15m
                        description: TokenTTL is how long the per-node bootstrap token
                          remains valid.
                        type: string
                    type: object
                  rke2:
                    properties:
                      tokenRef:
                        description: TokenRefSecret references the Secret holding
                          the long-lived RKE2 agent join token.
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        type: object
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one bootstrap provider must be set
                  rule: '[has(self.rke2), has(self.kubeadm)].exists_one(x, x)'
              env:
                description: |-
                  Env contains environment variables exported before userData and the provider-generated
                  node bootstrap steps. Values may be specified directly or read from a Secret.
                items:
                  properties:
                    name:
                      description: Name is the shell environment variable name.
                      pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                      type: string
                    value:
                      description: Value is the literal environment variable value.
                      type: string
                    valueFrom:
                      description: ValueFrom selects the environment variable value
                        from a Kubernetes object.
                      properties:
                        secretKeyRef:
                          description: SecretKeyRef selects a key of a Secret.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                            namespace:
                              type: string
                          type: object
                      type: object
                  required:
                  - name
                  type: object
                type: array
              ephemeralIPs:
                description: EphemeralIPs are the external addresses attached to every
                  launched instance.
                items:
                  description: EphemeralIP is one external address attached to an
                    instance at launch.
                  properties:
                    ipVersion:
                      description: IPVersion is the address family this entry allocates.
                      enum:
                      - v4
                      - v6
                      type: string
                    pool:
                      description: Pool is the IP pool to allocate from.
                      properties:
                        id:
                          description: ID is the exact IP pool UUID.
                          type: string
                        name:
                          description: Name is the exact name of an IP pool.
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of id or name must be set
                        rule: '[has(self.id), has(self.name)].exists_one(x, x)'
                  type: object
                  x-kubernetes-validations:
                  - message: an ephemeral IP needs an ipVersion, to take the silo's
                      default pool for that version, or a pool to allocate from
                    rule: has(self.ipVersion) || has(self.pool)
                maxItems: 2
                type: array
              imageSelector:
                description: ImageSelector is used to select an image to launch nodes
                  with.
                items:
                  properties:
                    id:
                      description: ID is the exact image UUID.
                      type: string
                    name:
                      description: Name is the name of an image.
                      type: string
                    os:
                      description: OS is the image operating system.
                      type: string
                    project:
                      description: Project where the image is located.
                      type: string
                    version:
                      description: Version is the version of the image or OS.
                      type: string
                  type: object
                type: array
              kubeletArgs:
                description: KubeletArgs are extra kubelet arguments in "key=value"
                  form applied to launched nodes.
                items:
                  type: string
                type: array
              server:
                description: Server is the endpoint nodes use to join the cluster.
                type: string
              sshKeySelector:
                description: SSHKeySelector selects SSH keys to copy to the node.
                items:
                  properties:
                    id:
                      description: ID is the exact SSH key ID.
                      type: string
                    name:
                      description: Name is the exact SSH key name.
                      type: string
                  type: object
                type: array
              storage:
                description: Storage is the disks every instance launched from this
                  nodeclass is created with.
                properties:
                  boot:
                    description: Boot is the disk the instance boots from.
                    properties:
                      pool:
                        description: Pool keeps unused boot disks ready.
                        properties:
                          enabled:
                            default: true
                            description: Enabled defaults to true.
                            type: boolean
                          maxReady:
                            default: 20
                            description: MaxReady is the largest ready pool.
                            format: int32
                            minimum: 0
                            type: integer
                          minReady:
                            default: 2
                            description: MinReady is the smallest ready pool.
                            format: int32
                            minimum: 0
                            type: integer
                          percentage:
                            default: 10
                            description: Percentage is the ready disks per 100 nodes.
                            format: int32
                            maximum: 100
                            minimum: 0
                            type: integer
                        type: object
                        x-kubernetes-validations:
                        - message: minReady must not exceed maxReady
                          rule: '!has(self.minReady) || !has(self.maxReady) || self.minReady
                            <= self.maxReady'
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Size is the boot disk's capacity.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - size
                    type: object
                  diskSets:
                    description: DiskSets are additional disks attached to every instance,
                      in sets of identically configured disks.
                    items:
                      description: DiskSet is a group of identically configured disks
                        attached to every launched instance.
                      properties:
                        count:
                          default: 1
                          description: Count is how many disks the set has.
                          format: int32
                          maximum: 7
                          minimum: 1
                          type: integer
                        filesystem:
                          description: Filesystem is what the guest formats each disk
                            with.
                          enum:
                          - ext4
                          - xfs
                          - None
                          type: string
                        imageSelector:
                          description: ImageSelector selects the image each disk in
                            the set is created from.
                          items:
                            properties:
                              id:
                                description: ID is the exact image UUID.
                                type: string
                              name:
                                description: Name is the name of an image.
                                type: string
                              os:
                                description: OS is the image operating system.
                                type: string
                              project:
                                description: Project where the image is located.
                                type: string
                              version:
                                description: Version is the version of the image or
                                  OS.
                                type: string
                            type: object
                          type: array
                        layout:
                          default: Individual
                          description: Layout is how the set's disks are presented
                            to the guest.
                          enum:
                          - Individual
                          type: string
                        mountDir:
                          description: MountDir is the parent directory the set's
                            disks are placed beneath.
                          maxLength: 253
                          pattern: ^/[^/]+(/[^/]+)*$
                          type: string
                        mountPath:
                          description: MountPath is the single mount point for a set
                            of one disk.
                          maxLength: 253
                          pattern: ^/[^/]+(/[^/]+)*$
                          type: string
                        name:
                          description: Name identifies the set.
                          maxLength: 20
                          minLength: 3
                          pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                          type: string
                        readOnly:
                          description: ReadOnly attaches sourced disks read-only.
                          type: boolean
                        size:
                          anyOf:
                          - type: integer
                          - type: string
                          description: Size is the capacity of each disk in the set,
                            not of the set as a whole.
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        snapshotSelector:
                          description: SnapshotSelector selects the snapshot each
                            disk in the set is created from.
                          items:
                            description: SnapshotSelector selects a snapshot by ID
                              or by name.
                            properties:
                              id:
                                description: ID is the exact snapshot UUID.
                                type: string
                              name:
                                description: Name is the name of a snapshot.
                                type: string
                              project:
                                description: Project where the snapshot is located.
                                type: string
                            type: object
                          type: array
                        type:
                          default: Distributed
                          description: Type selects Distributed or Local disks.
                          enum:
                          - Distributed
                          - Local
                          type: string
                      required:
                      - name
                      - size
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of mountPath or mountDir must be set
                        rule: '[has(self.mountPath), has(self.mountDir)].exists_one(x,
                          x)'
                      - message: mountPath is a single mount point, so it needs count
                          1; a set of several disks wants mountDir, which each disk
                          is mounted beneath
                        rule: '!has(self.mountPath) || self.count == 1'
                      - message: a raw block diskSet is not mounted, so it needs mountDir,
                          the directory its block devices are linked into, rather
                          than mountPath
                        rule: '!has(self.mountPath) || !has(self.filesystem) || self.filesystem
                          != ''None'''
                      - message: 'a Local diskSet cannot be created from an image
                          or a snapshot: the Oxide API has no disk source for a local
                          disk, and local disks cannot be created from distributed
                          disk images'
                        rule: self.type == 'Distributed' || (!has(self.imageSelector)
                          && !has(self.snapshotSelector))
                      - message: a diskSet may select an image or a snapshot, not
                          both
                        rule: '!(has(self.imageSelector) && has(self.snapshotSelector))'
                      - message: readOnly only means something for a diskSet created
                          from an image or a snapshot
                        rule: '!has(self.readOnly) || has(self.imageSelector) || has(self.snapshotSelector)'
                      - message: 'a diskSet created from an image or a snapshot already
                          carries a filesystem, so filesystem must not be set: it
                          would be formatted over'
                        rule: '!has(self.filesystem) || (!has(self.imageSelector)
                          && !has(self.snapshotSelector))'
                    maxItems: 7
                    type: array
                required:
                - boot
                type: object
                x-kubernetes-validations:
                - message: an instance can attach at most 8 disks and the boot disk
                    is one of them, so the diskSets' counts must sum to 7 or fewer
                  rule: '!has(self.diskSets) || self.diskSets.map(s, s.count).sum()
                    <= 7'
                - message: each diskSet must have a distinct name
                  rule: '!has(self.diskSets) || self.diskSets.all(x, self.diskSets.exists_one(y,
                    y.name == x.name))'
                - message: each diskSet must have a distinct mountPath or mountDir
                  rule: '!has(self.diskSets) || self.diskSets.all(x, self.diskSets.exists_one(y,
                    (has(y.mountPath) ? y.mountPath : y.mountDir) == (has(x.mountPath)
                    ? x.mountPath : x.mountDir)))'
              subnetSelector:
                description: SubnetSelector is used to select subnets to launch nodes
                  into.
                items:
                  properties:
                    id:
                      description: ID is the exact subnet ID.
                      type: string
                    name:
                      description: Name is the exact subnet name.
                      type: string
                    project:
                      description: Project where the subnet is located.
                      type: string
                    vpcID:
                      description: VPCID is the exact VPC ID.
                      type: string
                    vpcName:
                      description: VPCName is the exact VPC name.
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: a subnet selector needs a subnet id, VPC id, or VPC name
                    rule: has(self.id) || has(self.vpcID) || has(self.vpcName)
                  - message: a subnet name requires a VPC id or VPC name
                    rule: '!has(self.name) || has(self.vpcID) || has(self.vpcName)'
                  - message: a subnet selector cannot set both vpcID and vpcName
                    rule: '!(has(self.vpcID) && has(self.vpcName))'
                minItems: 1
                type: array
              userData:
                description: UserData is a bash fragment that runs before the provider-generated
                  node bootstrap steps.
                type: string
            required:
            - storage
            - subnetSelector
            type: object
          status:
            description: OxideNodeClassStatus is the resolved node class state.
            properties:
              affinityGroups:
                description: AffinityGroups contain the resolved groups that every
                  instance launched from this nodeclass joins.
                items:
                  description: OxideAffinityGroup is one resolved Oxide affinity or
                    anti-affinity group.
                  properties:
                    id:
                      type: string
                    managed:
                      description: Managed marks a provider-owned group.
                      type: boolean
                    name:
                      description: Name is the group's name at the time it resolved.
                      type: string
                    policy:
                      description: Policy is what the rack does when the group's constraint
                        cannot be satisfied, allow or fail.
                      type: string
                    type:
                      description: Type is Affinity or AntiAffinity, which is also
                        which Oxide endpoint the group is reached on.
                      type: string
                  required:
                  - id
                  - managed
                  - name
                  - policy
                  - type
                  type: object
                type: array
              bootstrap:
                description: Bootstrap contains resolved state that only applies to
                  a single bootstrap provider.
                properties:
                  kubeadm:
                    description: KubeadmStatus is the kubeadm discovery information
                      resolved from kube-public/cluster-info.
                    properties:
                      caCertHashes:
                        description: CACertHashes pin the cluster CA during token-based
                          discovery.
                        items:
                          type: string
                        type: array
                      clusterName:
                        description: ClusterName is the cluster name advertised by
                          the cluster-info kubeconfig.
                        type: string
                    type: object
                type: object
              conditions:
                description: Conditions contains health and readiness signals.
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              ephemeralIPs:
                description: EphemeralIPs contain the resolved pool each launched
                  instance takes an external address from.
                items:
                  description: OxideEphemeralIP is one resolved entry of spec.ephemeralIPs.
                  properties:
                    ipVersion:
                      description: IPVersion is the resolved address family, taken
                        from the pool when the spec named one.
                      type: string
                    poolID:
                      description: PoolID and PoolName are empty when the entry takes
                        the silo's default pool.
                      type: string
                    poolName:
                      type: string
                  required:
                  - ipVersion
                  type: object
                type: array
              images:
                description: Images contain selected images to use for the boot disk
                  of launched nodes, most recently uploaded first.
                items:
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    os:
                      type: string
                    project:
                      type: string
                    sizeBytes:
                      description: SizeBytes is the image size.
                      format: int64
                      type: integer
                    timeCreated:
                      format: date-time
                      type: string
                    version:
                      type: string
                  required:
                  - id
                  - name
                  - os
                  - project
                  - timeCreated
                  - version
                  type: object
                type: array
              kubeletArgs:
                description: KubeletArgs are applied to launched nodes.
                items:
                  type: string
                type: array
              nodeTaints:
                description: NodeTaints are applied to launched nodes.
                items:
                  type: string
                type: array
              server:
                description: Server is the user-defined or system discovered endpoint
                  that nodes will use to join the cluster.
                type: string
              sshKeys:
                description: SSHKeys contains the selected SSH keys.
                items:
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                  required:
                  - id
                  - name
                  type: object
                type: array
              storage:
                description: Storage is the resolved disk layout of a launched instance.
                properties:
                  bootDiskPool:
                    description: BootDiskPool is the current unused boot disk pool.
                    properties:
                      claimed:
                        format: int32
                        type: integer
                      configHash:
                        type: string
                      creating:
                        format: int32
                        type: integer
                      desired:
                        format: int32
                        type: integer
                      message:
                        type: string
                      ready:
                        format: int32
                        type: integer
                      stale:
                        format: int32
                        type: integer
                    required:
                    - claimed
                    - creating
                    - desired
                    - ready
                    - stale
                    type: object
                  bootSizeBytes:
                    description: BootSizeBytes is the boot disk size in bytes.
                    format: int64
                    type: integer
                  diskSets:
                    description: DiskSets is the resolved form of spec.storage.diskSets,
                      in the same order.
                    items:
                      description: DiskSetStatus is one resolved disk set.
                      properties:
                        blockLinks:
                          description: BlockLinks is where each of a raw block set's
                            devices is linked, in ordinal order.
                          items:
                            type: string
                          type: array
                        count:
                          description: Count is how many disks the set has, as resolved
                            after defaulting.
                          format: int32
                          type: integer
                        filesystem:
                          description: 'Filesystem is the effective value: ext4 where
                            the spec left it unset and formatting applies.'
                          type: string
                        images:
                          description: Images and Snapshots are the resolved sources,
                            most recent first and truncated the same way Status.Images
                            is.
                          items:
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              os:
                                type: string
                              project:
                                type: string
                              sizeBytes:
                                description: SizeBytes is the image size.
                                format: int64
                                type: integer
                              timeCreated:
                                format: date-time
                                type: string
                              version:
                                type: string
                            required:
                            - id
                            - name
                            - os
                            - project
                            - timeCreated
                            - version
                            type: object
                          type: array
                        layout:
                          type: string
                        mountPoints:
                          description: MountPoints is where each of the set's disks
                            is mounted, in ordinal order.
                          items:
                            type: string
                          type: array
                        name:
                          type: string
                        sizeBytes:
                          description: SizeBytes is the capacity of each disk in the
                            set, not of the set as a whole.
                          format: int64
                          type: integer
                        snapshots:
                          items:
                            description: OxideSnapshot is one resolved snapshot.
                            properties:
                              diskID:
                                description: DiskID is the snapshot's source disk.
                                type: string
                              id:
                                type: string
                              name:
                                type: string
                              project:
                                description: Project is the project the snapshot is
                                  in.
                                type: string
                              sizeBytes:
                                description: SizeBytes is the snapshot size.
                                format: int64
                                type: integer
                              timeCreated:
                                format: date-time
                                type: string
                            required:
                            - id
                            - name
                            - project
                            - timeCreated
                            type: object
                          type: array
                        type:
                          type: string
                      required:
                      - count
                      - layout
                      - name
                      - sizeBytes
                      - type
                      type: object
                    type: array
                type: object
              subnets:
                description: Subnets contains the selected subnets.
                items:
                  properties:
                    id:
                      type: string
                    ipv4Block:
                      type: string
                    ipv6Block:
                      type: string
                    name:
                      type: string
                    vpcID:
                      type: string
                    vpcName:
                      type: string
                  required:
                  - id
                  - name
                  - vpcID
                  - vpcName
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
