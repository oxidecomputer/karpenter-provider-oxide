---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: oxidecapacities.karpenter.oxide.computer
spec:
  group: karpenter.oxide.computer
  names:
    categories:
    - karpenter
    kind: OxideCapacity
    listKind: OxideCapacityList
    plural: oxidecapacities
    shortNames:
    - oxcap
    - oxcaps
    singular: oxidecapacity
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.globalInstanceTypes.unavailableCount
      name: GlobalUnavailable
      type: integer
    - jsonPath: .status.globalInstanceTypes.count
      name: GlobalTotal
      priority: 1
      type: integer
    - jsonPath: .status.inventory.state
      name: Inventory
      type: string
    - jsonPath: .status.quota.state
      name: Quota
      type: string
    - jsonPath: .status.history.storage.reason
      name: LastStorageFailure
      priority: 1
      type: string
    - jsonPath: .status.observedAt
      name: Updated
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: OxideCapacityStatus is what the provider currently believes
              about capacity.
            properties:
              globalInstanceTypes:
                properties:
                  count:
                    minimum: 0
                    type: integer
                  unavailableCount:
                    minimum: 0
                    type: integer
                required:
                - count
                - unavailableCount
                type: object
                x-kubernetes-validations:
                - rule: self.unavailableCount <= self.count
              history:
                properties:
                  omittedPlacementCount:
                    minimum: 0
                    type: integer
                  placement:
                    items:
                      properties:
                        lastRefusal:
                          format: date-time
                          type: string
                        message:
                          maxLength: 1024
                          type: string
                        messageTruncated:
                          type: boolean
                        placement:
                          items:
                            properties:
                              id:
                                minLength: 1
                                type: string
                              type:
                                enum:
                                - Affinity
                                - AntiAffinity
                                type: string
                            required:
                            - id
                            - type
                            type: object
                          minItems: 1
                          type: array
                          x-kubernetes-list-map-keys:
                          - type
                          - id
                          x-kubernetes-list-type: map
                        shape:
                          properties:
                            cpus:
                              minimum: 1
                              type: integer
                            memoryGiB:
                              minimum: 1
                              type: integer
                          required:
                          - cpus
                          - memoryGiB
                          type: object
                      required:
                      - placement
                      - shape
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  storage:
                    description: StorageRefusal is the most recent launch refused
                      for want of boot disk storage.
                    properties:
                      consecutiveRefusals:
                        description: ConsecutiveRefusals is how many launches in a
                          row have been refused this way.
                        type: integer
                      lastRefusal:
                        description: LastRefusal is when the most recent one happened.
                        format: date-time
                        type: string
                      message:
                        description: Message is the diagnosis as it was reported on
                          the NodeClaim that was refused.
                        maxLength: 1024
                        type: string
                      messageTruncated:
                        type: boolean
                      reason:
                        description: 'Reason is which limit was diagnosed as binding:
                          QuotaExceeded for the silo''s storage entitlement.'
                        type: string
                    required:
                    - consecutiveRefusals
                    - reason
                    type: object
                type: object
              inventory:
                description: Inventory is the latest rack capacity snapshot and its
                  inventory state.
                properties:
                  largestFeasibleInstanceType:
                    description: LargestFeasibleInstanceType is the largest shape
                      any single sled could take, as an instance type name.
                    type: string
                  observedAt:
                    description: ObservedAt is when the reading was taken, which is
                      not when this view was published.
                    format: date-time
                    type: string
                  omittedSledCount:
                    minimum: 0
                    type: integer
                  sleds:
                    description: Sleds is the per-sled headroom the reading is made
                      of.
                    items:
                      description: SledCapacity is one sled's remaining headroom.
                      properties:
                        freeCPUs:
                          description: FreeCPUs and FreeMemoryGiB are what is left
                            on the sled for instances.
                          type: integer
                        freeMemoryGiB:
                          type: integer
                        id:
                          description: ID is the Oxide sled ID.
                          type: string
                        largestFeasibleInstanceType:
                          description: LargestFeasibleInstanceType is the largest
                            shape this sled could take.
                          type: string
                        provisionable:
                          description: Provisionable is whether the sled will accept
                            a new instance at all.
                          type: boolean
                      required:
                      - freeCPUs
                      - freeMemoryGiB
                      - id
                      - provisionable
                      type: object
                    type: array
                  state:
                    description: 'State is what the reading is contributing: Disabled,
                      Unknown, Stale or Fresh.'
                    type: string
                type: object
              launchBackoffs:
                items:
                  properties:
                    consecutiveRefusals:
                      minimum: 1
                      type: integer
                    knownLaunchableShape:
                      properties:
                        cpus:
                          minimum: 1
                          type: integer
                        memoryGiB:
                          minimum: 1
                          type: integer
                      required:
                      - cpus
                      - memoryGiB
                      type: object
                    lastRefusal:
                      format: date-time
                      type: string
                    lastRefusedShape:
                      properties:
                        cpus:
                          minimum: 1
                          type: integer
                        memoryGiB:
                          minimum: 1
                          type: integer
                      required:
                      - cpus
                      - memoryGiB
                      type: object
                    message:
                      maxLength: 1024
                      type: string
                    messageTruncated:
                      type: boolean
                    minimumShape:
                      properties:
                        cpus:
                          minimum: 1
                          type: integer
                        memoryGiB:
                          minimum: 1
                          type: integer
                      required:
                      - cpus
                      - memoryGiB
                      type: object
                    reason:
                      minLength: 1
                      type: string
                    retryAfter:
                      format: date-time
                      type: string
                    scope:
                      properties:
                        cpuPlatforms:
                          items:
                            minLength: 1
                            type: string
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        placement:
                          items:
                            properties:
                              id:
                                minLength: 1
                                type: string
                              type:
                                enum:
                                - Affinity
                                - AntiAffinity
                                type: string
                            required:
                            - id
                            - type
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - type
                          - id
                          x-kubernetes-list-type: map
                        type:
                          enum:
                          - Global
                          - Placement
                          type: string
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - rule: 'self.type == ''Placement'' ? has(self.placement) &&
                          size(self.placement) > 0 && !has(self.cpuPlatforms) : !has(self.placement)'
                    state:
                      enum:
                      - Backoff
                      - ProbeEligible
                      - Probing
                      type: string
                  required:
                  - consecutiveRefusals
                  - lastRefusedShape
                  - minimumShape
                  - reason
                  - scope
                  - state
                  type: object
                  x-kubernetes-validations:
                  - rule: (self.state == 'Backoff') == has(self.retryAfter)
                type: array
                x-kubernetes-list-type: atomic
              observedAt:
                description: ObservedAt is when this view was last published.
                format: date-time
                type: string
              omittedLaunchBackoffCount:
                minimum: 0
                type: integer
              quota:
                description: Quota is the silo's remaining entitlement.
                properties:
                  observedAt:
                    format: date-time
                    type: string
                  remaining:
                    description: QuotaHeadroom is what the silo is still entitled
                      to launch.
                    properties:
                      cpus:
                        description: CPUs, MemoryGiB and StorageGiB are the quota's
                          capacity less what the silo has provisioned.
                        format: int64
                        type: integer
                      memoryGiB:
                        format: int64
                        type: integer
                      storageGiB:
                        format: int64
                        type: integer
                    required:
                    - cpus
                    - memoryGiB
                    - storageGiB
                    type: object
                  state:
                    enum:
                    - Unknown
                    - Fresh
                    - Stale
                    type: string
                required:
                - state
                type: object
                x-kubernetes-validations:
                - rule: 'self.state == ''Unknown'' ? !has(self.remaining) && !has(self.observedAt)
                    : has(self.remaining) && has(self.observedAt)'
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
