name: Release

# Releases are cut from GitHub Actions only, triggered by pushing a vX.Y.Z tag.
# Tags with a suffix (`make snapshot-tag`) publish as prereleases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  packages: write # push images and helm charts to ghcr.io

jobs:
  release:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history and tags

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Go trims build cache entries older than 5 days by mtime, which empties
      # a restored cache of that age. A fresh trim.txt skips the trim.
      - name: Keep restored Go build cache
        run: mkdir -p "$(go env GOCACHE)" && date +%s > "$(go env GOCACHE)/trim.txt"

      - name: Test
        run: make ci-verify

      # ko (run by GoReleaser) and helm push authenticate to the registry via
      # the Docker config this writes; GITHUB_TOKEN carries packages:write from
      # above.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
